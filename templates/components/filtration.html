<section>
    <div class="container">
        <div class="filtration-btns">
            <select name="category" id="1">
                <option value="" disabled selected hidden>Категория</option>
                {% for category in categories %}
                <option value="{{ category.name }}">{{ category.name }}</option>
                {% endfor %}
            </select>

            <select name="brand" id="2">
                <option value="" disabled selected hidden>Бренд</option>
                {% for brand in brands %}
                <option value="{{ brand.name }}">
                    {{ brand.name }}
                </option>

                {% endfor %}
            </select>

            <select name="state" id="3">
                <option value="" disabled selected hidden>Состояние</option>
                <option value="Б/У">Б/У</option>
                <option value="Новый">Новый</option>
            </select>

        </div>
    </div>
</section>
